[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-quality-intelligence-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fsspec>=2025.12.0,<2027",
    "huggingface-hub>=1.27.0,<2",
    "pyarrow>=25.0.1,<26",
    "pyspark>=4.2.0,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.2,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
