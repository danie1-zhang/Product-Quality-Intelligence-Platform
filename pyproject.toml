[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-quality-intelligence-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=1.27.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
